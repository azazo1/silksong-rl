[project]
name = "silksong-rl"
version = "0.1.0"
description = "丝之歌 Boss 强化学习训练代码 (与 mods/rl-env 插件配合)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.1",
    "stable-baselines3>=2.5",
    "torch>=2.9",
    "tensorboard>=2.18",
]

[project.scripts]
silksong-train = "silksong_rl.train:main"
silksong-selfcheck = "silksong_rl.selfcheck:main"
silksong-smoke = "silksong_rl.smoke:main"
silksong-record = "silksong_rl.record:main"
silksong-bc = "silksong_rl.bc:main"
silksong-report = "silksong_rl.report:main"
silksong-traces = "silksong_rl.traces:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silksong_rl"]

# Windows 上从 PyTorch 官方 CUDA 源取 torch, 避免装成 CPU 版.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
